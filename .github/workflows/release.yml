# Publish a Toren Linux release.
#
# Pushing a tag `v*` builds the ISO with the same steps as CI
# (.github/actions/build-iso), boot-tests it in QEMU with the test made
# strict, checksums it, optionally signs the checksums, and creates a GitHub
# Release with the files attached.
#
# Tags containing -alpha, -beta or -rc are published as pre-releases.
#
# Signing: if the repository secret MINISIGN_SECRET_KEY is set (the contents of
# a minisign secret key file, with MINISIGN_PASSWORD for an encrypted key),
# SHA256SUMS is signed as SHA256SUMS.sig. Without it, the release ships
# unsigned checksums and the log says so. Never commit a key.
#
# Test run: on a fork, push a test tag (e.g. v0.0.0-rc.test1) or run this
# workflow by hand with that tag. Delete the test release and tag afterwards.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v0.1.0-beta.1)
        required: true

permissions:
  contents: read

# One release per tag at a time, and never cancel a release halfway.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and checksum the ISO
    timeout-minutes: 75
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Resolve tag and version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          tag="${INPUT_TAG:-$REF_NAME}"
          # v1.2.3, v1.2.3-beta.1, v1.2.3-rc.2 ...
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$tag' is not a release tag like v0.1.0 or v0.1.0-beta.1"
            exit 1
          fi
          version="${tag#v}"
          case "$version" in
            *-alpha*|*-beta*|*-rc*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >>"$GITHUB_OUTPUT"
          echo "Releasing $tag (version $version, prerelease=$prerelease)"

      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Verify tagged commit is on main
        run: |
          set -eu
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Releases may only be created and uploaded from commits on main"
            exit 1
          fi

      # Hosted runners have /dev/kvm but only root can open it by default.
      # With KVM the boot test runs in seconds instead of minutes of emulation.
      - name: Enable KVM for the QEMU boot test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "No /dev/kvm on this runner; the strict boot test will run in software emulation"

      - name: Build, verify and boot-test the ISO
        id: iso
        uses: ./.github/actions/build-iso
        with:
          version: ${{ steps.version.outputs.version }}
          strict-boot: "true"

      - name: Collect release files and checksums
        env:
          ISO: ${{ steps.iso.outputs.iso }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          expected="toren-linux-${VERSION}-x86_64.iso"
          if [ "$(basename "$ISO")" != "$expected" ]; then
            echo "::error::built $(basename "$ISO"), expected $expected"
            exit 1
          fi
          mkdir -p dist
          mv "$ISO" "dist/$expected"
          (cd dist && sha256sum "$expected" >SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Sign checksums (if a key is configured)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::notice::MINISIGN_SECRET_KEY is not set; publishing unsigned SHA256SUMS (no SHA256SUMS.sig)"
            exit 0
          fi
          sudo apt-get install -y --no-install-recommends minisign >/dev/null
          keyfile="$RUNNER_TEMP/minisign.key"
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" >"$keyfile")
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "${MINISIGN_PASSWORD:-}" | \
            minisign -S -s "$keyfile" -m dist/SHA256SUMS -x dist/SHA256SUMS.sig -t "Toren Linux $VERSION"
          echo "Signed SHA256SUMS"

      - name: Upload ISO to SourceForge and enforce GitHub 2 GiB limit
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          expected="toren-linux-${VERSION}-x86_64.iso"
          uploaded_sf=0
          if [ -n "${SF_USERNAME:-}" ] && [ -n "${SF_SSH_KEY:-}" ]; then
            keyfile="$RUNNER_TEMP/sf_key"
            (umask 077 && printf '%s\n' "$SF_SSH_KEY" >"$keyfile")
            trap 'rm -f "$keyfile"' EXIT
            printf '%s\n' "-mkdir v${VERSION}" | sftp -i "$keyfile" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -b - \
              "${SF_USERNAME}@frs.sourceforge.net:/home/frs/project/toren-linux" || true
            rsync -avP -e "ssh -i $keyfile -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
              dist/ "${SF_USERNAME}@frs.sourceforge.net:/home/frs/project/toren-linux/v${VERSION}/"
            uploaded_sf=1
            echo "Uploaded release files to SourceForge: v${VERSION}"
          fi
          # GitHub rejects release assets of 2 GiB or more.
          size=$(stat -c %s "dist/$expected")
          if [ "$size" -ge 2147483648 ]; then
            if [ "$uploaded_sf" -eq 1 ]; then
              echo "::notice::$expected is $size bytes (>= 2 GiB); hosted on SourceForge and omitted from GitHub release assets"
              rm -f "dist/$expected"
            else
              echo "::error::$expected is $size bytes; GitHub release assets must be under 2 GiB and SF_USERNAME/SF_SSH_KEY are not set"
              exit 1
            fi
          fi

      - name: Upload boot test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-boot-test
          path: |
            ${{ runner.temp }}/qemu-test/serial.log
            ${{ runner.temp }}/qemu-test/boot-screen.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release files
        uses: actions/upload-artifact@v6
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    # The only job that can write: it runs no repository code, only gh.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.build.outputs.tag }}
          path: src

      - uses: actions/download-artifact@v7
        with:
          name: release-files
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -eu
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::a release for $TAG already exists; delete it first to re-run"
            exit 1
          fi
          flags=""
          [ "$PRERELEASE" = true ] && flags="--prerelease"
          # shellcheck disable=SC2086
          notes_file="$RUNNER_TEMP/release-notes.md"
          sf_url="https://sourceforge.net/projects/toren-linux/files/v${VERSION}/toren-linux-${VERSION}-x86_64.iso/download"
          {
            echo "## ISO Download"
            echo ""
            echo "- **Direct ISO (SourceForge)**: [toren-linux-${VERSION}-x86_64.iso](${sf_url})"
            echo "- **Verify**: \`sha256sum -c SHA256SUMS\`"
            echo ""
            if [ -f "src/docs/releases/$TAG.md" ]; then
              cat "src/docs/releases/$TAG.md"
            fi
          } >"$notes_file"
          flags="$flags --notes-file $notes_file"
          if [ ! -f "src/docs/releases/$TAG.md" ]; then
            flags="$flags --generate-notes"
          fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "Toren Linux $VERSION" \
            $flags
          gh release view "$TAG" --json url --jq .url
