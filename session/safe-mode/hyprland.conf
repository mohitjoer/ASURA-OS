# Toren Safe Mode Hyprland Configuration
# Minimal fallback desktop for system recovery and repair.
# No shell, no user configs, no external plugins.

monitor=,preferred,auto,1

# Core recovery keybindings
$mainMod = SUPER

# Launch terminal for recovery commands (Super+Return)
bind = $mainMod, Return, exec, ghostty
bind = $mainMod, Q, killactive
bind = $mainMod, C, killactive
bind = $mainMod, M, exit

# Minimal performance / rendering settings
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(33ccffee)
    col.inactive_border = rgba(595959aa)
}

decoration {
    rounding = 4
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_hyprland_guiutils_check = true
    background_color = 0x11111b
}

# Auto-spawn terminal on initial startup so user immediately has a shell
exec-once = ghostty
