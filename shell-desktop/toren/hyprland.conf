# The desktop's look, for Hyprland 0.49. An ASURA file, not vendored.
#
# The desktop styles half in the shell and half in the compositor: the
# frosted bar, sidebars and dock, the expressive animation curves. Corners
# are ASURA's: square. Its compositor half is written in hyprlang. Keybindings,
# input, monitors, workspaces and window rules stay ASURA's: nothing here binds
# a key.
#
# toren-session sources this through ~/.config/toren/hyprland/shell.conf only
# while org.toren.shell desktop-shell is 'desktop'. It is read before the user's
# files, so Settings, user.conf and the VM overrides (vm-perf.conf) still win.

general {
    gaps_in = 4
    gaps_out = 5
    gaps_workspaces = 50
    border_size = 2
    col.active_border = rgba(0DB7D455)
    col.inactive_border = rgba(31313600)
}

decoration {
    # Square windows. The shell keeps its own rounding (TorenBridge.qml says why).
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = true
    dim_strength = 0.05
    dim_special = 0.2
    blur {
        enabled = true
        xray = true
        special = false
        new_optimizations = true
        size = 10
        passes = 3
        brightness = 1
        noise = 0.05
        contrast = 0.89
        vibrancy = 0.5
        vibrancy_darkness = 0.5
        popups = false
        popups_ignorealpha = 0.6
        input_methods = true
        input_methods_ignorealpha = 0.8
    }
    shadow {
        enabled = true
        range = 20
        offset = 0 2
        render_power = 4
        color = rgba(00000020)
    }
}

animations {
    enabled = true
    bezier = expressiveFastSpatial, 0.42, 1.67, 0.21, 0.90
    bezier = expressiveSlowSpatial, 0.39, 1.29, 0.35, 0.98
    bezier = expressiveDefaultSpatial, 0.38, 1.21, 0.22, 1.00
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    bezier = standardDecel, 0, 0, 0, 1
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.52, 0.03, 0.72, 0.08
    bezier = stall, 1, -0.1, 0.7, 0.85
    animation = windowsIn, 1, 3, emphasizedDecel, popin 80%
    animation = fadeIn, 1, 3, emphasizedDecel
    animation = windowsOut, 1, 2, emphasizedDecel, popin 90%
    animation = fadeOut, 1, 2, emphasizedDecel
    animation = windowsMove, 1, 3, emphasizedDecel, slide
    animation = border, 1, 10, emphasizedDecel
    animation = layersIn, 1, 2.7, emphasizedDecel, popin 93%
    animation = layersOut, 1, 2.4, menu_accel, popin 94%
    animation = fadeLayersIn, 1, 0.5, menu_decel
    animation = fadeLayersOut, 1, 2.7, stall
    animation = workspaces, 1, 7, menu_decel, slide
    animation = specialWorkspaceIn, 1, 2.8, emphasizedDecel, slidevert
    animation = specialWorkspaceOut, 1, 1.2, emphasizedAccel, slidevert
    animation = zoomFactor, 1, 3, standardDecel
}

# The desktop surfaces are layers named quickshell:<surface>: frosted, with the
# animation each one is designed for.
layerrule = xray 1, .*
layerrule = blurpopups, quickshell:.*
layerrule = blur, quickshell:.*
layerrule = ignorealpha 0.79, quickshell:.*
layerrule = unset, quickshell:background
layerrule = animation slide, quickshell:bar
layerrule = noanim, quickshell:actionCenter
layerrule = animation slide bottom, quickshell:cheatsheet
layerrule = animation slide bottom, quickshell:dock
layerrule = animation popin 120%, quickshell:screenCorners
layerrule = noanim, quickshell:lockWindowPusher
layerrule = animation fade, quickshell:notificationPopup
layerrule = noanim, quickshell:overlay
layerrule = ignorealpha 1, quickshell:overlay
layerrule = noanim, quickshell:overview
layerrule = animation slide bottom, quickshell:osk
layerrule = noanim, quickshell:polkit
layerrule = xray 0, quickshell:popup
layerrule = ignorealpha 1, quickshell:popup
layerrule = ignorealpha 1, quickshell:mediaControls
layerrule = animation slide, quickshell:reloadPopup
layerrule = noanim, quickshell:regionSelector
layerrule = animation slide left, quickshell:sidebarLeft
layerrule = animation slide right, quickshell:sidebarRight
