layer: component

match:
  usb:
    - "27c6:*"

packages:
  - fprintd

kernel_parameters: []

files: []

services: []

notes:
  - "Knowledge source: libfprint supported devices list (vendor 27c6 Goodix Moch/Spi sensors)."
  - "Enables biometric authentication via 'asura enable fingerprint' or fprintd."
