id: intel-audio
name: "Intel Sound Open Firmware & HD Audio"
description: "Firmware and audio power-saving for Intel Sound Open Firmware (SOF) and HD Audio DSPs"
layer: component

match:
  module:
    - "snd_hda_intel"
    - "snd_sof_pci_intel_tgl"

packages:
  - sof-firmware

kernel_parameters: []

files:
  udev:
    - target: "/etc/udev/rules.d/99-toren-power.rules"
      source: "system/udev/99-toren-power.rules"
      reason: "Configure snd_hda_intel power_save=1 (Linux Documentation/sound/designs/powersave.rst)"

services: []

notes:
  - "Knowledge source: Linux kernel Documentation/sound/designs/powersave.rst and Sound Open Firmware project documentation."
  - "Installs sof-firmware for Intel Tiger Lake, Alder Lake, and Raptor Lake digital microphone arrays and DSPs."
