id: generic-laptop
name: "Generic Portable / Laptop"
description: "Universal power, thermal profile, backlight, and battery management for any portable PC"

match:
  chassis: "laptop"

packages: []

kernel_parameters: []

files:
  udev:
    - target: "/etc/udev/rules.d/99-asura-power.rules"
      source: "system/udev/99-asura-power.rules"
      reason: "Universal audio power-saving (snd_hda_intel power_save=1), PCIe ASPM, and SATA link power"
    - target: "/etc/udev/rules.d/90-backlight.rules"
      content: |
        # Allow users in video/input groups to adjust screen and keyboard brightness
        SUBSYSTEM=="backlight", ACTION=="add", RUN+="/bin/chmod a+w /sys/class/backlight/%k/brightness"
        SUBSYSTEM=="leds", KERNEL=="*::kbd_backlight", ACTION=="add", RUN+="/bin/chmod a+w /sys/class/leds/%k/brightness"
      reason: "Grant write permissions to display and keyboard backlight brightness sysfs entries"

services: []

notes:
  - "ACPI platform_profile: quiet, balanced, and performance thermal profiles via /sys/firmware/acpi/platform_profile ('asura power profile')."
  - "Universal battery management: automatically detects charge_control_end_threshold or charge_stop_threshold on BAT0/BAT1."
  - "PCIe ASPM & SATA ALPM: balances battery endurance and thermal dissipation under mobile workloads."
  - "Screen and keyboard backlight: write permissions granted to session seat users for smooth brightness controls."
