id: lenovo-thinkbook
name: "Lenovo ThinkBook"
description: "Lenovo ThinkBook business laptop hardware profile: conservation mode and thermal profiles"
layer: family

match:
  sys_vendor: "LENOVO"
  product_family: "*ThinkBook*"

packages: []

kernel_parameters: []

files:
  udev:
    - target: "/etc/udev/rules.d/99-lenovo-battery.rules"
      content: |
        # Lenovo battery conservation mode (caps charge at 60-80% for battery longevity)
        SUBSYSTEM=="platform", DRIVERS=="ideapad_acpi", ATTR{conservation_mode}="1"
      reason: "Enable Lenovo battery conservation mode (Linux drivers/platform/x86/lenovo/ideapad-laptop.c)"

services: []

notes:
  - "Knowledge source: Linux kernel drivers/platform/x86/lenovo/ideapad-laptop.c."
  - "Supports platform_profile thermal modes (balanced, extreme-performance, battery-saving)."
