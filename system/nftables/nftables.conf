#!/usr/sbin/nft -f
#
# ASURA's default host firewall: block unsolicited inbound traffic, allow
# everything outbound.
#
# Only ASURA's own table is replaced on reload. There is deliberately no
# `flush ruleset`: Docker and Podman install their own NAT and forwarding
# rules, and reloading this file must not wipe them. Forwarding is left to
# those tools, so this file filters the host's input chain only.
#
# Apply changes with `nft -f /etc/nftables.conf`, not `sv restart nftables`:
# the service's finish script runs `nft flush ruleset` on stop.
#
# To accept a service from the network (for example sshd on port 22), add a
# rule to the input chain in a file you own, or reload with your own table.

table inet asura_filter
delete table inet asura_filter

table inet asura_filter {
	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop
		iif "lo" accept

		# ICMPv6 is required for IPv6 neighbour discovery and path MTU.
		meta l4proto ipv6-icmp accept
		icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } accept

		# DHCPv6 replies from the router to this client.
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept
	}
}
