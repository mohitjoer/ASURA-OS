# Asura: tlp handles device power saving (USB autosuspend, Wi-Fi power save,
# SATA link power, PCIe runtime PM, audio codec power save). It must not touch
# what asura-sysd owns (`asura power ac|bat`, the Hub's CPU page), so those
# features are disabled here with PARAMETER="".
#
# tlp 1.10 has three profiles (AC, BAT and SAV). A profile that is left out
# inherits another profile's value, so every parameter below sets all three.
#
# Not set here because tlp has no default for them, so it leaves them alone:
# battery charge thresholds (owned by udev, system/udev/99-battery-threshold.rules).
# NVIDIA runtime PM is owned by system/udev/80-nvidia-pm.rules; tlp's default
# RUNTIME_PM_DRIVER_DENYLIST already excludes the nvidia driver.

# CPU frequency governor: asura-sysd
CPU_SCALING_GOVERNOR_ON_AC=""
CPU_SCALING_GOVERNOR_ON_BAT=""
CPU_SCALING_GOVERNOR_ON_SAV=""

# CPU energy/performance preference (EPP): asura-sysd
CPU_ENERGY_PERF_POLICY_ON_AC=""
CPU_ENERGY_PERF_POLICY_ON_BAT=""
CPU_ENERGY_PERF_POLICY_ON_SAV=""

# ACPI platform profile (/sys/firmware/acpi/platform_profile): asura-sysd
PLATFORM_PROFILE_ON_AC=""
PLATFORM_PROFILE_ON_BAT=""
PLATFORM_PROFILE_ON_SAV=""
